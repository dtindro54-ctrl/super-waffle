run-name: 
on:
  push:
    branches: [ main, master, utama ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repositori
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Terima Lisensi Android SDK Bawaan
        run: yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Generate Proyek Android & Build APK
        run: |
          python3 - << 'PYEOF'
          import os, textwrap

          files = {
              "settings.gradle": """
                  pluginManagement {
                      repositories {
                          google()
                          mavenCentral()
                          gradlePluginPortal()
                      }
                  }
                  dependencyResolutionManagement {
                      repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
                      repositories {
                          google()
                          mavenCentral()
                      }
                  }
                  rootProject.name = "ExamBrowser"
                  include ':app'
              """,
              "build.gradle": """
                  plugins {
                      id 'com.android.application' version '8.2.2' apply false
                      id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
                  }
              """,
              "gradle.properties": """
                  org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
                  android.useAndroidX=true
                  kotlin.code.style=official
                  android.nonTransitiveRClass=true
              """,
              "app/build.gradle": """
                  plugins {
                      id 'com.android.application'
                      id 'org.jetbrains.kotlin.android'
                  }

                  android {
                      namespace 'com.example.exambrowser'
                      compileSdk 34

                      defaultConfig {
                          applicationId "com.example.exambrowser"
                          minSdk 24
                          targetSdk 34
                          versionCode 1
                          versionName "1.0"
                      }

                      buildTypes {
                          release {
                              minifyEnabled false
                          }
                      }
                      compileOptions {
                          sourceCompatibility JavaVersion.VERSION_17
                          targetCompatibility JavaVersion.VERSION_17
                      }
                      kotlinOptions {
                          jvmTarget = '17'
                      }
                  }

                  dependencies {
                      implementation 'androidx.core:core-ktx:1.12.0'
                      implementation 'androidx.appcompat:appcompat:1.6.1'
                      implementation 'com.google.android.material:material:1.11.0'
                      implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
                  }
              """,
              "app/src/main/AndroidManifest.xml": """
                  <?xml version="1.0" encoding="utf-8"?>
                  <manifest xmlns:android="http://android.com">

                      <uses-permission android:name="android.permission.INTERNET" />
                      <uses-permission android:name="android.permission.CAMERA" />
                      <uses-feature android:name="android.hardware.camera" android:required="false" />

                      <application
                          android:allowBackup="false"
                          android:label="Exam Browser"
                          android:supportsRtl="true"
                          android:theme="@style/Theme.AppCompat.Light.NoActionBar"
                          android:usesCleartextTraffic="true">

                          <activity
                              android:name=".MainActivity"
                              android:exported="true"
                              android:lockTaskMode="if_whitelisted"
                              android:resizeableActivity="false"
                              android:screenOrientation="portrait">
                              <intent-filter>
                                  <action android:name="android.intent.action.MAIN" />
                                  <category android:name="android.intent.category.LAUNCHER" />
                              </intent-filter>
                          </activity>
                      </application>
                  </manifest>
